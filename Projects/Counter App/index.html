<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="w-full m-0 h-[100vh] bg-[#e4dfdf] flex justify-center items-center">
    <div class="w-[25rem] bg-white shadow-[1px_1px_4px_0px_gray] flex flex-col rounded-[2rem]">
        <div class="p-4 text-center">
            <h2 class="text-[25px] font-bold">Counter App</h2>
            <h2 class="text-[25px] font-bold text-[#0f1c50]">شمارنده</h2>
        </div>
        <div class="p-4">
            <div class="Counter text-center text-[30px] text-[#0f1c50]"></div>
            <div class="p-4 flex gap-4 justify-center items-center">
                <button class="minus text-[#0f1c50] shadow-[1px_1px_3px_3px_gray] bg-white w-[35px] h-[35px] rounded-[2rem] flex justify-center items-center text-[40px] pb-[8px] cursor-pointer select-none">-</button>
                <div class="btn-Counter text-[20px] bg-[#0f1c50] text-white p-3 rounded-[1rem] cursor-pointer">بازنشانی</div>
                <button class="Addition text-[#0f1c50] shadow-[1px_1px_3px_3px_gray] bg-white w-[35px] h-[35px] rounded-[2rem] flex justify-center items-center text-[30px] pb-[8px] select-none cursor-pointer">+</button>
            </div>
        </div>
        <div class="p-4 text-center">
            <p>برای شروع,روی + بزن</p>
        </div>
    </div>
    <script src="./Js/main.js"></script>
</body>
</html>
